# MoneyMap — base configuration (Section 15 §5)
server.port=${PORT:1010}
moneymap.data-dir=${DATA_DIR:./data}

# Session cookie hardening (Section 16 — Security; SameSite=Strict is the enforced standard)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Default container-level timeout; the effective per-session timeout is set at login
# from GlobalSettings.sessionTimeoutMinutes (Section 01 §3.1)
server.servlet.session.timeout=60m

# Profile photo upload limit (Section 01 §5.1 — default 5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Actuator: health endpoint only (used by the Docker healthcheck, Section 15 §4)
management.endpoints.web.exposure.include=health

spring.thymeleaf.cache=true
