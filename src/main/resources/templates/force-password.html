<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change your password')}"></head>
<body th:class="${themeClass}">

<div class="wizard-page">
<div class="wizard-card card">
    <h2 class="mt0">Change your password</h2>
    <p>This account is using the default installation password. For security, you must set a
        new password before continuing.</p>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <form th:action="@{/password/force}" method="post">
        <input type="hidden" name="_csrf" th:value="${csrf}">

        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" required autofocus>

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" required>
        <div class="strength-meter" data-strength-for="newPassword"
             th:attr="data-user-terms=${currentUser != null ? currentUser.username : ''}"><div></div></div>
        <div class="strength-label" data-strength-label-for="newPassword"></div>
        <div class="hint" th:text="${passwordRule}"></div>

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>

        <p><button type="submit">Set New Password</button></p>
    </form>
</div>
</div>

<script th:src="@{/js/password-strength.js}"></script>
</body>
</html>
