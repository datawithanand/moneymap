<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- "Money map" illustration: assets pinned across a map, all routes leading to one place.
     Pure inline SVG, themed via CSS variables. -->
<svg th:fragment="mapviz" viewBox="0 0 520 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A map of your assets — bank, home, gold, insurance, funds and retirement — all connected in one place"
     style="width:100%;max-width:520px;height:auto;display:block">
    <defs>
        <radialGradient id="mm-glow" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- map plate -->
    <rect x="10" y="10" width="500" height="420" rx="26" fill="var(--surface)" stroke="var(--border)"/>
    <!-- topo grid -->
    <g stroke="var(--border)" stroke-width="1" opacity="0.55">
        <path d="M10 100 H510 M10 190 H510 M10 280 H510 M10 370 H510" />
        <path d="M100 10 V430 M190 10 V430 M280 10 V430 M370 10 V430 M460 10 V430" />
    </g>
    <!-- terrain contours -->
    <g fill="none" stroke="var(--surface-alt)" stroke-width="10" opacity="0.8">
        <path d="M40 330 Q140 260 110 180 T230 60"/>
        <path d="M470 90 Q400 170 440 250 T330 400"/>
    </g>

    <!-- dashed routes from each asset pin to the central hub -->
    <g fill="none" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6 6" opacity="0.75">
        <path d="M110 92 Q170 150 246 208"/>
        <path d="M420 78 Q350 140 274 204"/>
        <path d="M74 260 Q160 240 244 222"/>
        <path d="M436 250 Q360 238 278 222"/>
        <path d="M138 372 Q190 310 250 236"/>
        <path d="M396 372 Q336 312 272 236"/>
    </g>

    <!-- central hub: your net worth, one place -->
    <circle cx="260" cy="220" r="86" fill="url(#mm-glow)"/>
    <circle cx="260" cy="220" r="46" fill="var(--primary)"/>
    <circle cx="260" cy="220" r="46" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.9"/>
    <text x="260" y="212" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="26"
          font-weight="700" fill="#ffffff">₹</text>
    <text x="260" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5"
          font-weight="600" fill="#ffffff" opacity="0.95">ONE PLACE</text>

    <!-- asset pins -->
    <g font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
        <!-- bank -->
        <g>
            <circle cx="110" cy="80" r="26" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
            <text x="110" y="87">🏦</text>
            <text x="110" y="124" font-size="10.5" font-weight="600" fill="var(--text-muted)">BANK &amp; FDs</text>
        </g>
        <!-- investments -->
        <g>
            <circle cx="420" cy="66" r="26" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
            <text x="420" y="73">📈</text>
            <text x="420" y="110" font-size="10.5" font-weight="600" fill="var(--text-muted)">MUTUAL FUNDS</text>
        </g>
        <!-- gold -->
        <g>
            <circle cx="62" cy="272" r="26" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
            <text x="62" y="279">🪙</text>
            <text x="62" y="316" font-size="10.5" font-weight="600" fill="var(--text-muted)">GOLD</text>
        </g>
        <!-- insurance -->
        <g>
            <circle cx="450" cy="262" r="26" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
            <text x="450" y="269">🛡️</text>
            <text x="450" y="306" font-size="10.5" font-weight="600" fill="var(--text-muted)">INSURANCE</text>
        </g>
        <!-- property -->
        <g>
            <circle cx="128" cy="384" r="26" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
            <text x="128" y="391">🏠</text>
            <text x="128" y="352" font-size="10.5" font-weight="600" fill="var(--text-muted)">PROPERTY</text>
        </g>
        <!-- retirement -->
        <g>
            <circle cx="406" cy="384" r="26" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
            <text x="406" y="391">🌱</text>
            <text x="406" y="352" font-size="10.5" font-weight="600" fill="var(--text-muted)">EPF · PPF · NPS</text>
        </g>
    </g>

    <!-- compass -->
    <g transform="translate(468,44)" opacity="0.75">
        <circle r="16" fill="var(--surface)" stroke="var(--border)"/>
        <path d="M0 -10 L4 4 L0 1 L-4 4 Z" fill="var(--primary)"/>
        <text y="-20" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text-muted)"
              font-family="system-ui, sans-serif">N</text>
    </g>
</svg>
</body>
</html>
