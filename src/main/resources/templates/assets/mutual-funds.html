<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mutual Funds')}"></head>
<body th:class="${themeClass}">

<div class="shell">
    <nav th:replace="~{fragments/layout :: sidebar('assets-investments')}"></nav>
    <main class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:6px">
            <div>
                <h1 style="margin-bottom:4px">Mutual Funds</h1>
                <p class="hint" style="margin:0">Track folios across equity, debt, hybrid and ELSS funds.</p>
            </div>
            <button type="button" class="btn"
                    th:attr="onclick=|openDrawer('${'/assets/mutual-funds/new'}', 'Add Mutual Funds')|">+ Add Fund</button>
        </div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0">
            <div class="card" style="margin-bottom:0">
                <div class="hint" style="margin-bottom:6px">Invested</div>
                <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:19px" th:text="${fmt.money(invested, currentUser)}"></div>
            </div>
            <div class="card" style="margin-bottom:0">
                <div class="hint" style="margin-bottom:6px">Current value</div>
                <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:19px" th:text="${fmt.money(currentValue, currentUser)}"></div>
            </div>
            <div class="card" style="margin-bottom:0">
                <div class="hint" style="margin-bottom:6px">Gain / loss</div>
                <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:19px"
                     th:style="'color:' + (${gainLoss} != null and ${gainLoss.signum()} < 0 ? 'var(--pill-down-fg)' : 'var(--pill-up-fg)')"
                     th:text="${fmt.money(gainLoss, currentUser)}"></div>
            </div>
            <div class="card" style="margin-bottom:0">
                <div class="hint" style="margin-bottom:6px">Overall return</div>
                <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:19px"
                     th:style="'color:' + (${returnPct} != null and ${returnPct} < 0 ? 'var(--pill-down-fg)' : 'var(--pill-up-fg)')"
                     th:text="(${returnPct} != null and ${returnPct} >= 0 ? '+' : '') + ${returnPct} + '%'"></div>
            </div>
        </div>

        <div class="pill-tabs" style="margin-bottom:16px">
            <a class="pill-tab" th:classappend="${catClass == 'all'} ? ' active'" th:href="@{/assets/mutual-funds(catClass='all')}">All</a>
            <a class="pill-tab" th:classappend="${catClass == 'equity'} ? ' active'" th:href="@{/assets/mutual-funds(catClass='equity')}">Equity</a>
            <a class="pill-tab" th:classappend="${catClass == 'debt'} ? ' active'" th:href="@{/assets/mutual-funds(catClass='debt')}">Debt</a>
            <a class="pill-tab" th:classappend="${catClass == 'hybrid'} ? ' active'" th:href="@{/assets/mutual-funds(catClass='hybrid')}">Hybrid</a>
            <a class="pill-tab" th:classappend="${catClass == 'elss'} ? ' active'" th:href="@{/assets/mutual-funds(catClass='elss')}">ELSS</a>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
            <table class="data">
                <thead>
                <tr>
                    <th style="text-align:left">Fund</th>
                    <th style="text-align:left">Category</th>
                    <th style="text-align:right">Invested</th>
                    <th style="text-align:right">Current</th>
                    <th style="text-align:right">Gain/Loss</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td>
                        <div style="font-size:14px;font-weight:700" th:text="${row.fundName}"></div>
                        <div style="font-size:12px;color:var(--text-muted)" th:text="'Folio ' + ${row.folioNumber}"></div>
                    </td>
                    <td>
                        <span class="pill"
                              th:classappend="${row.catClass == 'equity'} ? 'pill-blue' : (${row.catClass == 'debt'} ? 'pill-green' : (${row.catClass == 'hybrid'} ? 'pill-violet' : (${row.catClass == 'elss'} ? 'pill-amber' : 'pill-pink')))"
                              th:text="${row.category}"></span>
                    </td>
                    <td style="text-align:right" th:text="${fmt.cell(row.invested, currentUser)}"></td>
                    <td style="text-align:right;font-weight:600" th:text="${fmt.cell(row.currentValue, currentUser)}"></td>
                    <td style="text-align:right;font-weight:700"
                        th:style="${row.gainLoss} != null and ${row.gainLoss.signum()} < 0 ? 'text-align:right;font-weight:700;color:var(--pill-down-fg)' : 'text-align:right;font-weight:700;color:var(--pill-up-fg)'"
                        th:text="${fmt.cell(row.gainLoss, currentUser)}"></td>
                    <td style="white-space:nowrap;text-align:right">
                        <a class="btn btn-sm btn-secondary" th:href="@{'/assets/mutual-funds/' + ${row.id} + '/transactions'}">Transactions</a>
                        <button type="button" class="btn-sm btn-secondary"
                                th:attr="onclick=|openDrawer('${'/assets/mutual-funds/' + row.id + '/edit'}', 'Edit Mutual Funds')|">Edit</button>
                        <form class="inline" th:action="@{'/assets/mutual-funds/' + ${row.id} + '/delete'}"
                              method="post" onsubmit="return confirm('Delete this record?');">
                            <input type="hidden" name="_csrf" th:value="${csrf}">
                            <button type="submit" class="btn-sm btn-secondary">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${rows.isEmpty()}">
                    <td colspan="6" class="muted">Nothing here yet — add your first fund.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div class="drawer-scrim" id="drawerScrim" onclick="closeDrawer()"></div>
<div class="drawer" id="assetDrawer">
    <div class="drawer-header">
        <h2 id="drawerTitle">Add record</h2>
        <button type="button" class="drawer-close" onclick="closeDrawer()" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
function openDrawer(url, title) {
    document.getElementById('drawerTitle').textContent = title;
    document.getElementById('drawerBody').innerHTML = '<p class="muted">Loading…</p>';
    document.getElementById('drawerScrim').classList.add('open');
    document.getElementById('assetDrawer').classList.add('open');
    loadDrawerContent(url);
}
function closeDrawer() {
    document.getElementById('drawerScrim').classList.remove('open');
    document.getElementById('assetDrawer').classList.remove('open');
}
function loadDrawerContent(url) {
    fetch(url, { credentials: 'same-origin' }).then(function (r) { return r.text(); }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var root = doc.getElementById('assetFormRoot');
        document.getElementById('drawerBody').innerHTML = root ? root.innerHTML : '<p>Could not load form.</p>';
        bindDrawerForm();
        applyDrawerVisibility();
        bindDrawerFundPicker();
    });
}
function bindDrawerForm() {
    var form = document.querySelector('#drawerBody form');
    if (!form) return;
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        fetch(form.action, { method: 'POST', body: new FormData(form), credentials: 'same-origin' })
            .then(function (r) {
                if (r.redirected) { window.location.href = r.url; return; }
                return r.text().then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var root = doc.getElementById('assetFormRoot');
                    document.getElementById('drawerBody').innerHTML = root ? root.innerHTML : html;
                    bindDrawerForm();
                    applyDrawerVisibility();
                    bindDrawerFundPicker();
                });
            });
    });
}
function applyDrawerVisibility() {
    document.querySelectorAll('#drawerBody [data-visible-if]').forEach(function (el) {
        var cond = el.getAttribute('data-visible-if');
        if (!cond) return;
        var eq = cond.indexOf('=');
        var field = cond.substring(0, eq), wanted = cond.substring(eq + 1).split('|');
        var src = document.getElementById(field) || document.querySelector('#drawerBody [name="' + field + '"]');
        if (!src) return;
        var current = src.type === 'checkbox' ? String(src.checked) : src.value;
        el.style.display = wanted.indexOf(current) !== -1 ? '' : 'none';
    });
}
document.addEventListener('change', function (e) {
    if (e.target.closest && e.target.closest('#drawerBody')) applyDrawerVisibility();
});
function bindDrawerFundPicker() {
    var searchBox = document.getElementById('fundPickerSearch');
    if (!searchBox) return;
    var categorySelect = document.getElementById('fundPickerCategory');
    var resultsList = document.getElementById('fundPickerResults');
    var debounceTimer;
    function runSearch() {
        var q = searchBox.value.trim();
        if (q.length < 2) { resultsList.innerHTML = ''; return; }
        var url = '/assets/mutual-funds/fund-search?q=' + encodeURIComponent(q)
                + '&category=' + encodeURIComponent(categorySelect.value);
        fetch(url).then(function (r) { return r.json(); }).then(function (items) {
            resultsList.innerHTML = '';
            items.forEach(function (item) {
                var li = document.createElement('li');
                li.style.cursor = 'pointer';
                li.style.padding = '4px 0';
                li.textContent = item.schemeName + (item.fundHouse ? ' — ' + item.fundHouse : '');
                li.addEventListener('click', function () { selectFund(item.schemeCode); });
                resultsList.appendChild(li);
            });
        });
    }
    function selectFund(schemeCode) {
        fetch('/assets/mutual-funds/fund-detail/' + schemeCode).then(function (r) { return r.json(); })
            .then(function (detail) {
                if (detail.error) { alert(detail.error); return; }
                document.getElementById('schemeCode').value = detail.schemeCode;
                document.getElementById('fundName').value = detail.schemeName;
                if (detail.fundHouse) document.getElementById('amcName').value = detail.fundHouse;
                if (detail.latestNav) document.getElementById('currentNavPerUnit').value = detail.latestNav;
                if (detail.navAsOfDate) document.getElementById('navAsOfDate').value = detail.navAsOfDate;
                resultsList.innerHTML = '';
                searchBox.value = detail.schemeName;
            });
    }
    searchBox.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runSearch, 300);
    });
    categorySelect.addEventListener('change', runSearch);
}
</script>

</body>
</html>
