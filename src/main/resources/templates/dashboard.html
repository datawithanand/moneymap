<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body th:class="${themeClass}">

<div th:replace="~{fragments/layout :: adminViewBanner}"></div>

<div class="shell">
    <nav th:replace="~{fragments/layout :: sidebar('dashboard')}"></nav>
    <main class="content">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">
            <h1 th:text="'Welcome, ' + ${user.fullName}">Welcome</h1>
            <form method="get" th:action="@{/dashboard}">
                <select name="tag" onchange="this.form.submit()">
                    <option value="">Whole family</option>
                    <option th:each="m : ${household}" th:value="${m.label}" th:text="${m.label}"
                            th:selected="${tag == m.label}"></option>
                </select>
            </form>
        </div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <div style="display:flex;flex-direction:column;gap:20px">

            <!-- Hero: net worth headline + delta, then a 4-tile KPI row (Assets/Liabilities/
                 Insurance cover/Goal progress) — matches the Dashboard design handoff exactly. -->
            <div style="background:var(--ink);border-radius:18px;padding:28px 32px;color:#fff;min-width:0">
                <div style="min-width:0;margin-bottom:22px">
                    <div style="font-size:13px;color:oklch(75% 0.01 260);font-weight:600;margin-bottom:8px">Total net worth</div>
                    <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.01em;margin-bottom:10px;overflow-wrap:anywhere"
                         th:text="${fmt.money(summary.netWorth, user)}">₹ —</div>
                    <div th:if="${delta != null}" style="display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap">
                        <span th:style="'font-weight:700;color:' + (${delta.signum() >= 0} ? 'oklch(70% 0.13 155)' : 'oklch(70% 0.15 25)')"
                              th:text="${(delta.signum() >= 0 ? '▲ ' : '▼ ') + fmt.money(delta, user) + (netWorthDeltaPercent != null ? ' (' + netWorthDeltaPercent.abs() + '%)' : '')}"></span>
                        <span style="color:oklch(65% 0.01 260)">since your last snapshot</span>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0">
                    <div style="background:var(--ink-inset);border-radius:12px;padding:14px 16px;min-width:0">
                        <div style="font-size:12px;color:oklch(75% 0.01 260);margin-bottom:6px">Assets</div>
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;overflow-wrap:anywhere" th:text="${fmt.money(summary.totalAssets, user)}"></div>
                    </div>
                    <div style="background:var(--ink-inset);border-radius:12px;padding:14px 16px;min-width:0">
                        <div style="font-size:12px;color:oklch(75% 0.01 260);margin-bottom:6px">Liabilities</div>
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;overflow-wrap:anywhere;color:oklch(70% 0.15 25)" th:text="${fmt.money(summary.totalLiabilities, user)}"></div>
                    </div>
                    <div style="background:var(--ink-inset);border-radius:12px;padding:14px 16px;min-width:0">
                        <div style="font-size:12px;color:oklch(75% 0.01 260);margin-bottom:6px">Insurance cover</div>
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;overflow-wrap:anywhere" th:text="${fmt.money(heroInsuranceCover, user)}"></div>
                    </div>
                    <div style="background:var(--ink-inset);border-radius:12px;padding:14px 16px;min-width:0">
                        <div style="font-size:12px;color:oklch(75% 0.01 260);margin-bottom:6px">Goal progress</div>
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;overflow-wrap:anywhere"
                             th:text="${heroGoalProgressPercent != null ? heroGoalProgressPercent + '%' : '—'}"></div>
                    </div>
                </div>
            </div>

            <!-- Portfolio allocation -->
            <div class="card" style="margin-bottom:0">
                <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;margin-bottom:18px">Portfolio allocation</div>
                <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
                    <div class="allocation-chart-wrap" style="justify-content:flex-start">
                        <canvas id="allocationChart" width="120" height="120"></canvas>
                    </div>
                    <div style="display:flex;gap:28px;font-size:13.5px;flex-wrap:wrap">
                        <div th:each="a : ${allocationClasses}" th:if="${a['percent'].signum() > 0}" style="display:flex;align-items:center;gap:8px;white-space:nowrap">
                            <span style="width:9px;height:9px;border-radius:2px;flex-shrink:0"
                                  th:style="'width:9px;height:9px;border-radius:2px;flex-shrink:0;background:' + (${currentUser.theme.name() == 'DARK'} ? ${a['colorDark']} : ${a['color']})"></span>
                            <span style="color:var(--text-muted)" th:text="${a['name']}"></span>
                            <span style="font-weight:700" th:text="${a['percent']} + '%'"></span>
                        </div>
                        <span th:if="${allocationTotal == null or allocationTotal.signum() == 0}" class="muted">No data yet.</span>
                    </div>
                </div>
            </div>

            <!-- Module cards: Investments / Retirement / Cash & Banking / Insurance cover / Real Estate / Loans & Cards -->
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0">
                <a th:each="m : ${moduleCards}" th:href="@{'/assets/' + ${m.hrefKey}}"
                   style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;box-sizing:border-box;color:inherit;text-decoration:none">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0">
                        <div style="font-size:13px;font-weight:700;color:var(--text-muted);line-height:1.3" th:text="${m.name}"></div>
                        <div style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0"
                             th:style="'width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:' + ${m.iconBg}">
                            <span style="width:8px;height:8px;border-radius:2px" th:style="'width:8px;height:8px;border-radius:2px;background:' + ${m.iconColor}"></span>
                        </div>
                    </div>
                    <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:19px" th:text="${fmt.money(m.value, user)}"></div>
                    <div th:if="${m.change != null}" style="font-size:12px;font-weight:600"
                         th:style="'font-size:12px;font-weight:600;color:' + (${m.changeIsGrowth} ? 'var(--badge-green-fg)' : (${m.changeIsDecline} ? 'var(--danger)' : 'var(--text-muted)'))"
                         th:text="${m.change}"></div>
                </a>
            </div>

            <!-- Goals & SIPs + Upcoming reminders -->
            <div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;min-width:0">
                <div class="card" style="margin-bottom:0">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:15px">Goals &amp; SIPs</div>
                        <a th:href="@{/assets/goals}" style="font-size:13px;font-weight:700">View all</a>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:16px">
                        <div th:each="g : ${goalProgressRows}">
                            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                                <div style="font-size:13.5px;font-weight:600" th:text="${g.name}"></div>
                                <div style="font-size:13px;color:var(--text-muted)" th:text="${fmt.money(g.current, user)} + ' / ' + ${fmt.money(g.target, user)}"></div>
                            </div>
                            <div style="height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden">
                                <div style="height:100%;background:var(--primary);border-radius:4px" th:style="'height:100%;background:var(--primary);border-radius:4px;width:' + ${g.pct} + '%'"></div>
                            </div>
                        </div>
                        <p th:if="${goalProgressRows.isEmpty()}" class="muted">No goals with a target date yet.</p>
                    </div>
                </div>

                <div class="card" style="margin-bottom:0">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
                        <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:15px">Upcoming reminders</div>
                        <a th:href="@{/dashboard/reminders}" style="font-size:13px;font-weight:700">View all</a>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:14px">
                        <div th:each="r : ${reminders}" style="display:flex;align-items:center;gap:12px">
                            <div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0"></div>
                            <a style="flex:1;font-size:13.5px;color:inherit" th:href="@{'/assets/' + ${r.modulePath()} + '/' + ${r.recordId()} + '/edit'}" th:text="${r.description()}"></a>
                            <div style="font-size:12.5px;color:var(--text-muted)" th:text="${r.dueDate()}"></div>
                        </div>
                        <p th:if="${reminders.isEmpty()}" class="muted">Nothing due in the next 30 days.</p>
                    </div>
                </div>
            </div>

            <!-- Real, honest utility actions the mockup doesn't show but the app needs — kept
                 minimal and out of the way rather than folded into the mockup's visual language. -->
            <p style="margin:0">
                <form class="inline" th:action="@{/dashboard/snapshot}" method="post">
                    <input type="hidden" name="_csrf" th:value="${csrf}">
                    <button type="submit" class="btn-secondary btn-sm">Take Net Worth Snapshot</button>
                </form>
                <a class="btn btn-secondary btn-sm" th:href="@{/family/dashboard}">Family Dashboard</a>
            </p>
        </div>
    </main>
</div>

<script th:src="@{/js/vendor/chart.min.js}"></script>
<script th:inline="javascript">
/*<![CDATA[*/
(function () {
    var style = getComputedStyle(document.body);
    var border = style.getPropertyValue('--border').trim() || '#ddd7c8';
    var isDark = document.body.classList.contains('theme-dark');
    function seriesColor(row) { return isDark ? row.colorDark : row.color; }

    var allocationLabels = [], allocationValues = [], allocationColors = [];
    var allocationClasses = /*[[${allocationClasses}]]*/ [];
    allocationClasses.forEach(function (a) {
        if (a.percent > 0) {
            allocationLabels.push(a.name);
            allocationValues.push(a.percent);
            allocationColors.push(seriesColor(a));
        }
    });
    if (allocationValues.length === 0) {
        allocationLabels = ['No data yet'];
        allocationValues = [1];
        allocationColors = [border];
    }
    var canvas = document.getElementById('allocationChart');
    if (canvas) {
        new Chart(canvas, {
            type: 'doughnut',
            data: { labels: allocationLabels, datasets: [{ data: allocationValues, backgroundColor: allocationColors, borderWidth: 0 }] },
            options: { responsive: false, cutout: '68%', plugins: { legend: { display: false } } }
        });
    }
})();
/*]]>*/
</script>
</body>
</html>
